# ASP.NET Core Unified Deployment Pipeline
# Build and deploy ASP.NET Core projects to Azure Linux Web Apps
# Supports both framework-dependent and self-contained deployments
# Supports both production and test environments
#
# The pipeline automatically configures the target app service based on deployment mode:
# - Sets SELF_CONTAINED_DEPLOYMENT environment variable (true/false)
# - Configures startup command (/home/site/wwwroot/m4d for self-contained, empty for framework-dependent)
# - Sets M4D_DATA_ROOT and, with runFromPackage, WEBSITE_RUN_FROM_PACKAGE (before the deploy),
#   and stops and starts the app after the deploy when that switches run-from-package on or off
# - No manual Azure Portal configuration required

pool:
  vmImage: ubuntu-latest

parameters:
  - name: deploymentMode
    displayName: "Deployment Mode"
    type: string
    default: "framework-dependent"
    values:
      - "framework-dependent"
      - "self-contained"

  - name: environment
    displayName: "Target Environment"
    type: string
    default: "test"
    values:
      - "production"
      - "test"

  # Mounts the deployed zip read-only as wwwroot instead of extracting it over the running app,
  # so a deploy never serves half-replaced assemblies. Turn it off to go back to extracting.
  - name: runFromPackage
    displayName: "Run From Package"
    type: boolean
    default: true

variables:
  buildConfiguration: "Release"
  ${{ if eq(parameters.environment, 'production') }}:
    appName: "msc4dnc"
    aspnetEnvironment: "Production"
    searchIndex: "SongIndexProd"
    searchIndexVersion: "3"
  ${{ if eq(parameters.environment, 'test') }}:
    appName: "m4d-test"
    aspnetEnvironment: "Staging"
    searchIndex: "SongIndexTest"
    searchIndexVersion: "3"
  ${{ if eq(parameters.deploymentMode, 'self-contained') }}:
    useSelfContained: true
  ${{ if eq(parameters.deploymentMode, 'framework-dependent') }}:
    useSelfContained: false

steps:
  # ===== CLIENT BUILD =====
  - task: NodeTool@0
    displayName: "Install Node.js"
    inputs:
      versionSpec: "22.x"

  - script: corepack enable
    displayName: "Enable Corepack"

  - script: yarn config set globalFolder "$(Agent.BuildDirectory)\Yarn\Berry"
    displayName: "Set Yarn global folder"
    workingDirectory: m4d/ClientApp/

  - script: yarn install --network-timeout=300000
    displayName: "Install Yarn dependencies"
    workingDirectory: m4d/ClientApp/

  - script: yarn build
    displayName: "Build Vue.js ClientApp"
    workingDirectory: m4d/ClientApp/

  # ===== SERVER BUILD =====
  - task: UseDotNet@2
    displayName: "Install .NET 10 SDK"
    inputs:
      packageType: "sdk"
      version: "10.x"

  - script: dotnet build --configuration $(buildConfiguration)
    displayName: "Build .NET project ($(buildConfiguration))"

  # ===== PUBLISH (Self-Contained) =====
  # projects is pinned to m4d/m4d.csproj rather than relying on publishWebProjects: true
  # solution-wide auto-discovery, so the sandbox stub host (m4d.Sandbox, a second Web-SDK
  # project - see architecture/dev-testing/contributor-test-environments.md) is never a publish/deploy
  # candidate. m4d.csproj itself has no ProjectReference to the *.Sandbox projects, so this
  # keeps their code and seed data structurally unreachable from the deployed artifact.
  - task: DotNetCoreCLI@2
    displayName: "Publish web project (self-contained)"
    condition: eq(variables['useSelfContained'], true)
    inputs:
      command: "publish"
      publishWebProjects: false
      projects: "m4d/m4d.csproj"
      arguments: "--configuration $(buildConfiguration) --runtime linux-x64 --self-contained true /p:SelfContained=true"

  # ===== PUBLISH (Framework-Dependent) =====
  - task: DotNetCoreCLI@2
    displayName: "Publish web project (framework-dependent)"
    condition: eq(variables['useSelfContained'], false)
    inputs:
      command: "publish"
      publishWebProjects: false
      projects: "m4d/m4d.csproj"
      arguments: "--configuration $(buildConfiguration) --runtime linux-x64"

  # ===== RUN FROM PACKAGE =====
  # Kudu decides when the zip arrives whether to extract it into wwwroot or keep it in
  # /home/data/SitePackages and mount it, and AzureWebApp@1 applies its appSettings only after
  # deploying - so WEBSITE_RUN_FROM_PACKAGE has to be set here, before the deploy. M4D_DATA_ROOT
  # moves the app's runtime writes out of wwwroot. It's set either way, so flipping runFromPackage
  # doesn't move the data. Settings are written only when they change, because each write
  # restarts the app. See architecture/plans/run-from-package.md.
  - task: AzureCLI@2
    displayName: "Configure Run From Package (${{ parameters.runFromPackage }})"
    inputs:
      azureSubscription: "m4d-release"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -euo pipefail
        APP=$(appName)
        GROUP=$(az webapp list --query "[?name=='$APP'].resourceGroup" -o tsv)
        if [ -z "$GROUP" ]; then
          echo "##vso[task.logissue type=error]Could not find app '$APP'"
          exit 1
        fi

        setting() {
          az webapp config appsettings list -g "$GROUP" -n "$APP" --query "[?name=='$1'].value | [0]" -o tsv
        }

        DATA_ROOT=/home/data/m4d
        WANT_RUN_FROM_PACKAGE=$(echo "${{ parameters.runFromPackage }}" | tr '[:upper:]' '[:lower:]')
        CURRENT_ROOT=$(setting M4D_DATA_ROOT)
        CURRENT_RUN_FROM_PACKAGE=$(setting WEBSITE_RUN_FROM_PACKAGE)
        echo "Current: M4D_DATA_ROOT='$CURRENT_ROOT' WEBSITE_RUN_FROM_PACKAGE='$CURRENT_RUN_FROM_PACKAGE'"

        UPDATES=()
        if [ "$CURRENT_ROOT" != "$DATA_ROOT" ]; then
          UPDATES+=("M4D_DATA_ROOT=$DATA_ROOT")
        fi
        if [ "$WANT_RUN_FROM_PACKAGE" = "true" ] && [ "$CURRENT_RUN_FROM_PACKAGE" != "1" ]; then
          UPDATES+=("WEBSITE_RUN_FROM_PACKAGE=1")
        fi

        SWITCHED=false
        if [ "$WANT_RUN_FROM_PACKAGE" = "true" ] && [ "$CURRENT_RUN_FROM_PACKAGE" != "1" ]; then
          SWITCHED=true
        fi

        if [ ${#UPDATES[@]} -gt 0 ]; then
          echo "Setting ${UPDATES[*]}"
          az webapp config appsettings set -g "$GROUP" -n "$APP" --settings "${UPDATES[@]}" -o none
        fi
        if [ "$WANT_RUN_FROM_PACKAGE" != "true" ] && [ -n "$CURRENT_RUN_FROM_PACKAGE" ]; then
          echo "Removing WEBSITE_RUN_FROM_PACKAGE"
          az webapp config appsettings delete -g "$GROUP" -n "$APP" --setting-names WEBSITE_RUN_FROM_PACKAGE -o none
          SWITCHED=true
        fi
        echo "##vso[task.setvariable variable=runFromPackageSwitched]$SWITCHED"

  # ===== DEPLOY WITH CONFIGURATION =====
  # Deploy and configure app settings in a single atomic operation
  # This approach uses the AzureWebApp task's built-in appSettings parameter
  # which avoids permission issues and ensures settings are applied during deployment

  # Self-Contained Deployment
  - task: AzureWebApp@1
    displayName: "Deploy to Azure Web App ($(appName)) - self-contained"
    condition: eq(variables['useSelfContained'], true)
    inputs:
      azureSubscription: "m4d-release"
      appType: "webAppLinux"
      appName: "$(appName)"
      package: "$(System.DefaultWorkingDirectory)/**/*.zip"
      startUpCommand: "/home/site/wwwroot/m4d"
      appSettings: -SELF_CONTAINED_DEPLOYMENT true -ASPNETCORE_ENVIRONMENT $(aspnetEnvironment) -SEARCHINDEX $(searchIndex) -SEARCHINDEXVERSION $(searchIndexVersion) -WEBSITES_CONTAINER_START_TIME_LIMIT 600

  # Framework-Dependent Deployment
  - task: AzureWebApp@1
    displayName: "Deploy to Azure Web App ($(appName)) - framework-dependent"
    condition: eq(variables['useSelfContained'], false)
    inputs:
      azureSubscription: "m4d-release"
      appType: "webAppLinux"
      appName: "$(appName)"
      package: "$(System.DefaultWorkingDirectory)/**/*.zip"
      runtimeStack: "DOTNETCORE|10.0"
      startUpCommand: "dotnet m4d.dll"
      appSettings: -SELF_CONTAINED_DEPLOYMENT false -ASPNETCORE_ENVIRONMENT $(aspnetEnvironment) -SEARCHINDEX $(searchIndex) -SEARCHINDEXVERSION $(searchIndexVersion) -WEBSITES_CONTAINER_START_TIME_LIMIT 600

  # ===== RESTART AFTER A RUN FROM PACKAGE SWITCH =====
  # Switching WEBSITE_RUN_FROM_PACKAGE restarts the app before the package exists. When the package
  # then arrives mid-startup, App Service fails to remount wwwroot, stops the site and waits about
  # five minutes before retrying on its own (seen on m4d-test, 2026-11-02). Start it right away
  # instead, and wait for it to answer. This stops and then starts rather than restarting: a restart
  # that lands while a start is still in progress cancels that start, and App Service then stops the
  # site and leaves it stopped. A site that hasn't come up in three minutes gets one more start.
  # Ordinary deploys skip this.
  - task: AzureCLI@2
    displayName: "Stop and start after Run From Package switch"
    condition: and(succeeded(), eq(variables['runFromPackageSwitched'], 'true'))
    inputs:
      azureSubscription: "m4d-release"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -uo pipefail
        APP=$(appName)
        GROUP=$(az webapp list --query "[?name=='$APP'].resourceGroup" -o tsv)
        HOST=$(az webapp show -g "$GROUP" -n "$APP" --query defaultHostName -o tsv)

        echo "Stopping and starting $APP"
        az webapp stop -g "$GROUP" -n "$APP" -o none
        az webapp start -g "$GROUP" -n "$APP" -o none
        START=$SECONDS
        RETRIED=false
        while [ $((SECONDS - START)) -lt 600 ]; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$HOST/" || true)
          if [ "$CODE" = "200" ]; then
            echo "$APP is up after $((SECONDS - START))s"
            exit 0
          fi
          if [ "$RETRIED" = "false" ] && [ $((SECONDS - START)) -ge 180 ]; then
            echo "Not up after $((SECONDS - START))s (last status $CODE); starting again"
            az webapp start -g "$GROUP" -n "$APP" -o none
            RETRIED=true
          fi
          sleep 5
        done
        echo "##vso[task.logissue type=error]$APP did not answer with 200 within 10 minutes of the start"
        exit 1

  # ===== CONFIGURE HEALTH CHECK =====
  # Points Azure's platform health check at /health/ready (reflects live database health) instead
  # of the default of no check at all. Looks up the app by name so this doesn't need a hardcoded
  # resource group. Non-fatal: a failure here shouldn't block an otherwise-successful deployment.
  - task: AzureCLI@2
    displayName: "Configure health check path"
    continueOnError: true
    inputs:
      azureSubscription: "m4d-release"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        APP_ID=$(az webapp list --query "[?name=='$(appName)'].id" -o tsv)
        if [ -z "$APP_ID" ]; then
          echo "##vso[task.logissue type=warning]Could not find app '$(appName)' to configure health check path"
        else
          az webapp config set --ids "$APP_ID" --generic-configurations '{"healthCheckPath": "/health/ready"}'
        fi
