name: CI-SERVER

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore

      # -warnaserror keeps the server build warning clean: any new compiler or analyzer
      # warning fails CI rather than accumulating silently. Restore runs as its own step
      # above, so NuGet audit advisories (NU1901-NU1904) that appear when a new CVE is
      # published against an unchanged dependency can't break an unrelated PR here.
      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --logger trx --results-directory ./TestResults --filter FullyQualifiedName!~SelfCrawler
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

