name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # nightly
  # Promote to `pull_request` once the suite has proven stable for a couple of weeks.
  # See architecture/playwright-e2e-testing.md for the full write-up.

jobs:
  check-activity:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for commits in the last 24 hours
        id: check
        run: |
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    runs-on: ubuntu-latest
    needs: check-activity
    # Manual runs always go through; the nightly schedule skips when nothing landed in the last 24h.
    if: github.event_name == 'workflow_dispatch' || needs.check-activity.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Enable Corepack
        run: corepack enable

      - name: Build client
        working-directory: m4d/ClientApp
        run: |
          yarn install --network-timeout=300000
          yarn build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # Debug, not Release: playwright.config.ts's webServer runs `dotnet run` with no
      # --configuration flag, which defaults to Debug. Building Release here would warm up an
      # output `dotnet run` never looks at, leaving the real Debug build to happen live inside
      # Playwright's webServer.timeout window - confirmed by a run that timed out at 60s on a
      # cold CI runner (https://github.com/music4dance/music4dance/actions/runs/34002133865).
      - name: Build m4d.Sandbox
        run: dotnet build m4d.Sandbox/m4d.Sandbox.csproj --configuration Debug

      - name: Install Playwright
        working-directory: e2e
        run: |
          yarn install --network-timeout=300000
          yarn playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: yarn test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: (!cancelled())
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
