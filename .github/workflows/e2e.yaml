name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # nightly
  # Promote to `pull_request` once the suite has proven stable for a couple of weeks.
  # See architecture/playwright-e2e-testing.md for the full write-up.

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Enable Corepack
        run: corepack enable

      - name: Build client
        working-directory: m4d/ClientApp
        run: |
          yarn install --network-timeout=300000
          yarn build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build m4d.Sandbox
        run: dotnet build m4d.Sandbox/m4d.Sandbox.csproj --configuration Release

      - name: Install Playwright
        working-directory: e2e
        run: |
          yarn install --network-timeout=300000
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: yarn test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: (!cancelled())
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
